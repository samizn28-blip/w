<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف محمد وأريج</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcfbfa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* المشهد الأول: الظرف */
        #scene1 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            transition: opacity 0.5s ease-in-out;
        }

        .envelope {
            width: 280px;
            height: 180px;
            background: #ffffff;
            border-radius: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #f0edeb;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s ease;
        }

        .envelope:hover {
            transform: scale(1.03);
        }

        .envelope-initials {
            font-size: 36px;
            font-weight: bold;
            color: #cca43b;
            text-shadow: 0 0 10px rgba(204, 164, 59, 0.2);
            font-family: 'Times New Roman', serif;
        }

        .click-hint {
            margin-top: 20px;
            color: #8a857c;
            font-size: 14px;
            animation: pulse 1.5s infinite;
        }

        /* المشهد الثاني: بطاقة الدعوة والخلفية المخصصة */
        #scene2 {
            display: none;
            width: 100%;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            background-image: url('background.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .card-container {
            max-width: 450px;
            width: 85%;
            background: rgba(255, 255, 255, 0.88); 
            backdrop-filter: blur(8px); 
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.6);
            margin: 20px 0;
        }

        .card-initials {
            font-size: 42px;
            font-weight: bold;
            color: #cca43b;
            margin-bottom: 15px;
        }

        h2, h3 {
            color: #2b2927;
            margin: 10px 0;
        }

        p {
            color: #57534e;
            line-height: 1.6;
        }

        .rsvp-form {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(204, 164, 59, 0.2);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd7d0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: rgba(255,255,255,0.9);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #cca43b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #b38f32;
        }

        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            color: #2e7d32;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <!-- موسيقى خلفية هادئة تعمل طوال الوقت -->
    <audio loop id="bg-music">
        <source src="music.mp3" type="audio/mp3">
    </audio>

    <!-- المشهد الأول: الظرف -->
    <div id="scene1">
        <div class="envelope" id="envBtn">
            <div class="envelope-initials">M & A</div>
        </div>
        <div class="click-hint">اضغط على الظرف لفتح الدعوة</div>
    </div>

    <!-- المشهد الثاني: تفاصيل الدعوة والخلفية الجديدة -->
    <div id="scene2">
        <div class="card-container">
            <div class="card-initials">M & A</div>
            <h2>دعوة زفاف غالية</h2>
            <p>بكل حب وباقة من الورود، يتشرف محمد وأريج بدعوتكم لمشاركتهم فرحة العمر في الليلة التي تجمع قلبينا.</p>
            <p>حضوركم ينير ليلتنا ويسعد قلوبنا.</p>

            <!-- نموذج تأكيد الحضور (RSVP) المخفض والمباشر -->
            <div class="rsvp-form" id="rsvp-section">
                <h3>تأكيد الحضور</h3>
                <form id="weddingForm">
                    <input type="text" id="guestName" placeholder="الاسم الكريم" required>
                    
                    <select id="attendanceStatus" required>
                        <option value="" disabled selected>هل ستشرفنا بالحضور؟</option>
                        <option value="أوافق وبكل سرور">أوافق وبكل سرور</option>
                        <option value="أعتذر لظروف خاصة">أعتذر وأتمنى لكم الفرحة</option>
                    </select>

                    <button type="submit" class="btn" id="submitBtn">إرسال التأكيد</button>
                </form>
                <div id="message"></div>
            </div>
        </div>
    </div>

<script>
    // رابط السكريبت الخاص بك مفعّل تلقائياً
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyk17Sw51QdwTChT2QhzN544_BG3DiV96GPiYaSLudUB4tnv3LqQ4nyR6z0ZIrJGfDy/exec';

    // الانتقال المباشر والآمن بين المشاهد
    document.getElementById('envBtn').addEventListener('click', function() {
        const s1 = document.getElementById('scene1');
        const s2 = document.getElementById('scene2');
        const music = document.getElementById('bg-music');

        try {
            music.play().catch(e => console.log("تم تأجيل تشغيل الصوت حسب سياسة المتصفح"));
        } catch(err) { }

        s1.style.opacity = '0';
        setTimeout(() => {
            s1.style.display = 'none';
            s2.style.display = 'flex';
            setTimeout(() => {
                s2.style.opacity = '1';
            }, 50);
        }, 500);
    });

    // الحماية من تكرار الرد من نفس المتصفح
    if (localStorage.getItem('hasRSVPed')) {
        document.getElementById('rsvp-section').innerHTML = "<h3>شكراً لك! لقد تم تسجيل ردك مسبقاً بنجاح.</h3>";
    }

    document.getElementById('weddingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const msgDiv = document.getElementById('message');
        
        submitBtn.disabled = true;
        msgDiv.innerText = "جاري إرسال ردك...";

        const payload = {
            name: document.getElementById('guestName').value,
            status: document.getElementById('attendanceStatus').value,
            guests: 0 // يتم تمرير القيمة صفر تلقائياً بعد إلغاء حقل عدد الحضور
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            cache: 'no-cache',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            localStorage.setItem('hasRSVPed', 'true');
            document.getElementById('rsvp-section').innerHTML = "<h3>تم إرسال تأكيدك بنجاح، ننتظركم بكل حب!</h3>";
        })
        .catch(error => {
            console.error('Error:', error);
            msgDiv.innerText = "عذراً، حدث خطأ أثناء الإرسال. يرجى المحاولة مجدداً.";
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
