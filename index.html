<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyber-Shooter Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div class="hud-card">النقاط: <span id="score-val">0</span></div>
            <div class="hud-card">الموجة: <span id="wave-val">1</span></div>
            <div class="hud-card">
                الدروع: 
                <div class="health-bar-bg">
                    <div id="health-bar-fill"></div>
                </div>
            </div>
        </div>

        <div id="overlay-screen" class="active">
            <h1 id="screen-title">NEON CYBER-SHOOTER</h1>
            <p id="screen-desc">تحكم بالسفينة باستخدام لوحة المفاتيح أو الفأرة، دمر الأعداء وصمد لأطول فترة ممكنة.</p>
            <button id="start-btn">ابدأ اللعب الان</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="game.js"></script>
</body>
</html>
